<!DOCTYPE html>
<html>
<head>
<title>Odd or Even (0–15)</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #eef2f7;
        margin-top: 60px;
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
        background-color: #6c8cff;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    button:hover {
        background-color: #4a6ee0;
    }

    #output {
        margin-top: 20px;
        font-size: 18px;
        color: #333;
        line-height: 1.6;
    }
</style>

</head>

<body>

<h2>Odd or Even from 0 to 15</h2>
<button onclick="checkNumbers()">Show Result</button>

<div id="output"></div>

<script>
function checkNumbers() {
    let result = "";

    for (let i = 0; i <= 15; i++) {
        if (i % 2 === 0) {
            result += i + " is even<br>";
        } else {
            result += i + " is odd<br>";
        }
    }

    document.getElementById("output").innerHTML = result;
}
</script>

</body>
</html>
